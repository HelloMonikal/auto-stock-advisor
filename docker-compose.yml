services:
  web:
    image: hellomonika/stock-advisor:latest
    command: python3 -m streamlit run app.py
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - stock_data:/app/.tmp
      - stock_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


volumes:
  stock_data:
  stock_logs:
